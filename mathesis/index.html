<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mathesis — Interactive Calculus Atlas</title>
    <meta
      name="description"
      content="Learn calculus chapter by chapter: differentiation, integration and their applications, with interactive graphs you can drag, slide and play with."
    />
    <meta property="og:title" content="Mathesis — Interactive Calculus Atlas" />
    <meta
      property="og:description"
      content="Learn calculus chapter by chapter: differentiation, integration and their applications, with interactive graphs you can drag, slide and play with."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      :root {
        --bg: #f6f3ea;
        --panel: #fffdf7;
        --line: #d9d3c0;
        --ink: #14213d;
        --muted: #5b6477;
        --accent: #c2371d;
        --accent-ink: #ffffff;
        --accent-tint: #f6dfd7;
        --chip: #ebe6d6;
        --grid: rgba(52, 90, 140, 0.1);
        --grid-strong: rgba(52, 90, 140, 0.18);
        --c-f: #1d5fa8;
        --c-d: #2a7f62;
        --c-dd: #b7791f;
        --c-area: rgba(29, 95, 168, 0.18);
        --shadow: 20, 33, 61;
        --serif: "STIX Two Text", "Iowan Old Style", Georgia, serif;
        --sans: "Inter", "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      }
      html[data-theme="board"] {
        --bg: #13201d;
        --panel: #192a26;
        --line: #2f4741;
        --ink: #eef1e6;
        --muted: #9bb0a6;
        --accent: #ff8a5c;
        --accent-ink: #13201d;
        --accent-tint: #3a2a22;
        --chip: #223631;
        --grid: rgba(238, 241, 230, 0.06);
        --grid-strong: rgba(238, 241, 230, 0.12);
        --c-f: #7cc4ff;
        --c-d: #8ee0a8;
        --c-dd: #ffd166;
        --c-area: rgba(124, 196, 255, 0.2);
        --shadow: 0, 0, 0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 24px 24px;
        transition:
          background-color 0.5s var(--ease),
          color 0.5s var(--ease);
        overflow-x: hidden;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 3px;
      }
      svg {
        display: block;
      }
      .ico {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* Topbar */
      header.topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .topbar .menu {
        width: 36px;
        height: 36px;
        border-radius: 4px;
        display: none;
      }
      .topbar .menu:hover {
        background: var(--chip);
      }
      .topbar .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .topbar .logo-box {
        width: 28px;
        height: 28px;
        border: 1.5px solid var(--ink);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--serif);
        font-style: italic;
        font-size: 20px;
        line-height: 1;
      }
      .topbar .logo-text {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 21px;
        letter-spacing: -0.01em;
      }
      .topbar nav.crumbs {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 8px;
        white-space: nowrap;
      }
      .topbar nav.crumbs span.sep {
        opacity: 0.5;
      }
      .topbar .searchbtn {
        height: 34px;
        min-width: 240px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 12.5px;
        text-align: left;
        transition:
          border-color 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
      }
      .topbar .searchbtn:hover {
        border-color: var(--accent);
      }
      .topbar .searchbtn kbd {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 10.5px;
        background: var(--chip);
        padding: 2px 6px;
        border-radius: 3px;
        color: var(--ink);
      }
      .topbar button#theme {
        width: 34px;
        height: 34px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .topbar button#theme:hover {
        background: var(--chip);
      }

      /* Progress ring */
      .ring {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex: none;
      }
      .ring svg {
        transform: rotate(-90deg);
      }
      .ring circle.track {
        stroke: var(--line);
        fill: none;
      }
      .ring circle.val {
        stroke: var(--accent);
        fill: none;
        stroke-linecap: round;
        transition:
          stroke-dashoffset 0.6s var(--ease),
          stroke 0.3s var(--ease);
      }
      .ring.done circle.val {
        stroke: var(--c-d);
      }
      .ring-txt {
        position: absolute;
        font-family: var(--mono);
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        inset: 0;
      }

      /* Shell Grid */
      .shell {
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr) 220px;
        min-height: calc(100dvh - 56px);
        max-width: 1500px;
        margin: 0 auto;
      }

      /* Sidebar */
      aside.side {
        position: sticky;
        top: 56px;
        height: calc(100dvh - 56px);
        overflow-y: auto;
        padding: 16px 12px 28px 20px;
        border-right: 1px solid var(--line);
        scrollbar-width: thin;
      }
      .chap {
        margin-bottom: 8px;
      }
      .chead {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 8px;
        border-radius: 4px;
        text-align: left;
        transition: background 0.2s var(--ease);
      }
      .chead:hover {
        background: var(--chip);
      }
      .chap.soon {
        opacity: 0.6;
      }
      .chead .meta {
        flex: 1;
        min-width: 0;
      }
      .chead .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .chead small {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
      .chead .chev {
        width: 14px;
        height: 14px;
        color: var(--muted);
        transition: transform 0.3s var(--ease);
      }
      .chap.open .chead .chev {
        transform: rotate(90deg);
      }
      .chap-lessons {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s var(--ease);
      }
      .chap.open .chap-lessons {
        grid-template-rows: 1fr;
      }
      .chap-lessons-inner {
        overflow: hidden;
      }
      .lesson-link {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 20px;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 13.5px;
        line-height: 1.3;
        color: var(--muted);
        transition:
          background 0.18s var(--ease),
          color 0.18s var(--ease);
      }
      .lesson-link:hover {
        background: var(--chip);
        color: var(--ink);
      }
      .lesson-link .num {
        font-family: var(--mono);
        font-size: 10.5px;
        width: 28px;
        flex: none;
        color: var(--muted);
      }
      .lesson-link .name {
        flex: 1;
        min-width: 0;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
      .lesson-link[aria-current="page"] {
        background: var(--accent-tint);
        color: var(--ink);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .lesson-link .chk {
        color: var(--c-d);
        width: 14px;
        height: 14px;
        margin-left: auto;
      }

      /* Lesson Main Column */
      main#view {
        padding: 44px clamp(20px, 4vw, 56px) 96px;
        max-width: 880px;
        width: 100%;
      }
      .article-wrap {
        max-width: 70ch;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1.lesson-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(34px, 4.2vw, 48px);
        line-height: 1.1;
        letter-spacing: -0.015em;
        margin-top: 10px;
        color: var(--ink);
      }
      .meta-row {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        font-family: var(--mono);
        font-size: 10.5px;
        padding: 5px 9px;
        border-radius: 3px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
      }
      .chip.interactive {
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      }

      .body-text {
        font-family: var(--serif);
        font-size: 18.5px;
        line-height: 1.7;
        text-wrap: pretty;
        margin-top: 20px;
        counter-reset: sec;
      }
      .body-text p {
        margin-top: 1.15em;
      }
      .body-text h2 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 26px;
        margin: 48px 0 14px;
        counter-increment: sec;
        scroll-margin-top: 72px;
        color: var(--ink);
        line-height: 1.2;
      }
      .body-text h2::before {
        content: "§" counter(sec);
        font: 500 12px var(--mono);
        color: var(--accent);
        margin-right: 10px;
        letter-spacing: 0.06em;
        vertical-align: middle;
      }

      /* KaTeX overrides */
      .katex {
        font-size: 1.08em;
      }
      .katex-display {
        margin: 18px 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px 0;
      }

      /* Callouts */
      .callout {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 14px 18px 16px;
        margin: 24px 0;
        position: relative;
      }
      .callout.k-definition {
        border-left: 4px solid var(--c-f);
      }
      .callout.k-theorem {
        border-left: 4px solid var(--accent);
      }
      .callout.k-tip {
        border-left: 4px solid var(--c-d);
      }
      .callout.k-warning {
        border-left: 4px solid var(--c-dd);
      }

      .callout-label {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .k-definition .callout-label {
        color: var(--c-f);
      }
      .k-theorem .callout-label {
        color: var(--accent);
      }
      .k-tip .callout-label {
        color: var(--c-d);
      }
      .k-warning .callout-label {
        color: var(--c-dd);
      }
      .callout-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 17.5px;
        color: var(--ink);
        margin-bottom: 6px;
        line-height: 1.3;
      }
      .callout-body {
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.65;
      }

      /* Details derivation */
      details.derivation {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        margin: 24px 0;
        overflow: hidden;
        transition: border-color 0.2s var(--ease);
      }
      details.derivation summary {
        list-style: none;
        padding: 12px 16px;
        cursor: pointer;
        font-family: var(--serif);
        font-weight: 600;
        font-size: 16.5px;
        display: flex;
        align-items: center;
        gap: 10px;
        user-select: none;
        color: var(--ink);
      }
      details.derivation summary::-webkit-details-marker {
        display: none;
      }
      details.derivation summary .chev {
        width: 14px;
        height: 14px;
        color: var(--muted);
        transition: transform 0.3s var(--ease);
      }
      details.derivation[open] summary .chev {
        transform: rotate(90deg);
      }
      .derivation-content {
        padding: 4px 16px 16px;
        border-top: 1px solid var(--line);
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.65;
      }

      /* Examples */
      .example-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 20px;
        margin: 24px 0;
        box-shadow:
          inset 0 0 0 3px var(--panel),
          inset 0 0 0 4px var(--line);
      }
      .example-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 12px;
      }
      .example-no {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--accent);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .example-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 18px;
        color: var(--ink);
      }
      .example-steps {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 14px;
      }
      .step-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .step-num {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        margin-top: 2px;
        background: var(--bg);
      }
      .step-text {
        font-family: var(--serif);
        font-size: 17.5px;
        line-height: 1.6;
        flex: 1;
      }
      .answer-box {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .answer-box .ans-lbl {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .answer-box .ans-val {
        border: 1.5px solid var(--ink);
        padding: 6px 12px;
        border-radius: 3px;
        font-family: var(--serif);
        font-size: 17.5px;
        background: var(--bg);
      }

      /* Common mistakes list */
      .mistakes-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--c-dd);
        border-radius: 4px;
        padding: 16px 20px;
        margin: 24px 0;
      }
      .mistakes-title {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--c-dd);
        font-weight: 600;
        margin-bottom: 12px;
      }
      .mistake-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 8px;
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.55;
      }
      .mistake-x {
        color: var(--c-dd);
        font-weight: bold;
        flex: none;
      }

      /* Practice problems */
      .practice-list {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin: 24px 0;
      }
      .practice-item {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 16px 18px;
        transition: border-color 0.2s var(--ease);
      }
      .practice-q {
        font-family: var(--serif);
        font-size: 17.5px;
        line-height: 1.6;
      }
      .practice-sol-btn {
        margin-top: 12px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        background: var(--bg);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.18s var(--ease);
      }
      .practice-sol-btn:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      .practice-sol-btn .chev {
        width: 12px;
        height: 12px;
        transition: transform 0.3s var(--ease);
      }
      .practice-sol-drawer {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s var(--ease);
      }
      .practice-sol-drawer.open {
        grid-template-rows: 1fr;
      }
      .practice-sol-inner {
        overflow: hidden;
        padding-top: 14px;
        border-top: 1px dashed var(--line);
        margin-top: 12px;
      }

      /* Quick recap panel */
      .recap-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
        padding: 16px 20px;
        margin: 36px 0;
      }
      .recap-eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 8px;
      }
      .recap-list {
        margin: 0;
        padding-left: 18px;
        font-family: var(--serif);
        font-size: 17.5px;
        line-height: 1.65;
      }
      .recap-list li {
        margin-top: 6px;
      }

      /* Complete Button */
      button.complete {
        width: 100%;
        height: 46px;
        border: 1.5px solid var(--ink);
        border-radius: 4px;
        font-family: var(--serif);
        font-size: 17px;
        color: var(--ink);
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 40px;
        transition: all 0.25s var(--ease);
      }
      button.complete:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      button.complete:active {
        transform: scale(0.98);
      }
      button.complete.is-done {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      button.complete.is-done .ico {
        color: var(--accent-ink);
      }

      /* Previous / Next Grid */
      .pn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }
      .pn-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition:
          transform 0.25s var(--ease),
          border-color 0.25s var(--ease);
      }
      .pn-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .pn-card.next {
        text-align: right;
        align-items: flex-end;
      }
      .pn-eyebrow {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .pn-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 17px;
        color: var(--ink);
      }

      /* TOC Right rail */
      aside.toc {
        position: sticky;
        top: 56px;
        padding: 44px 20px 0 0;
        align-self: start;
        max-height: calc(100dvh - 56px);
        overflow-y: auto;
      }
      .toc-sticky {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toc-eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .toc-nav {
        display: flex;
        flex-direction: column;
      }
      .toc-link {
        font-size: 13px;
        line-height: 1.35;
        color: var(--muted);
        padding: 5px 0 5px 12px;
        border-left: 1px solid var(--line);
        transition: all 0.18s var(--ease);
      }
      .toc-link:hover {
        color: var(--ink);
      }
      .toc-link.active {
        color: var(--ink);
        border-left: 2px solid var(--accent);
        padding-left: 11px;
        font-weight: 500;
      }

      /* Widget Chrome */
      figure.widget {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow:
          inset 0 0 0 3px var(--panel),
          inset 0 0 0 4px var(--line);
        margin: 28px 0;
        overflow: hidden;
      }
      .widget-head {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--panel);
      }
      .widget-title-tag {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .widget-reset {
        width: 24px;
        height: 24px;
        border-radius: 3px;
        color: var(--muted);
        transition: color 0.18s var(--ease);
      }
      .widget-reset:hover {
        color: var(--ink);
      }
      .widget-canvas-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        min-height: 280px;
        background: var(--bg);
        touch-action: none;
        overflow: hidden;
      }
      .widget-canvas-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .widget-controls {
        padding: 14px 16px;
        display: grid;
        gap: 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .control-label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        min-width: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .control-label span.val {
        color: var(--ink);
        font-weight: 500;
      }
      .ctrl-select,
      .ctrl-input {
        height: 34px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 10px;
        font-family: var(--sans);
        font-size: 13px;
        color: var(--ink);
      }
      .ctrl-select:focus,
      .ctrl-input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .seg-group {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .seg-btn {
        padding: 5px 11px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border-right: 1px solid var(--line);
        transition: all 0.15s var(--ease);
      }
      .seg-btn:last-child {
        border-right: none;
      }
      .seg-btn:hover {
        color: var(--ink);
        background: var(--chip);
      }
      .seg-btn.active {
        background: var(--ink);
        color: var(--panel);
      }

      .play-btn {
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 11px;
        background: var(--chip);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.18s var(--ease);
      }
      .play-btn:hover {
        border-color: var(--accent);
      }

      .readout-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 8px;
        padding: 10px 16px;
        background: var(--panel);
        border-top: 1px solid var(--line);
      }
      .readout-cell {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .readout-cell .lbl {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
      }
      .readout-cell .num {
        font-family: var(--mono);
        font-size: 15px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      figcaption.widget-caption {
        padding: 8px 16px 12px;
        font-family: var(--serif);
        font-style: italic;
        font-size: 13px;
        color: var(--muted);
        background: var(--panel);
      }

      /* Home View */
      .hero {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 40px;
        padding: 56px clamp(20px, 4vw, 56px) 24px;
        max-width: 1300px;
      }
      .hero-h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(40px, 5.4vw, 72px);
        line-height: 1.02;
        letter-spacing: -0.025em;
        color: var(--ink);
        margin: 12px 0 16px;
      }
      .hero-lede {
        font-family: var(--serif);
        font-size: 18px;
        line-height: 1.6;
        color: var(--muted);
        max-width: 46ch;
        margin-bottom: 28px;
      }
      .hero-btns {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
      }
      .btn-primary {
        height: 46px;
        padding: 0 22px;
        border-radius: 4px;
        background: var(--accent);
        color: var(--accent-ink);
        font-family: var(--sans);
        font-weight: 500;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition:
          transform 0.2s var(--ease),
          opacity 0.2s;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        opacity: 0.95;
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-secondary {
        height: 46px;
        padding: 0 22px;
        border-radius: 4px;
        border: 1.5px solid var(--ink);
        color: var(--ink);
        font-family: var(--sans);
        font-weight: 500;
        font-size: 15px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        transition:
          transform 0.2s var(--ease),
          border-color 0.2s;
      }
      .btn-secondary:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
      }
      .btn-secondary:active {
        transform: scale(0.98);
      }
      .continue-link {
        font-family: var(--sans);
        font-size: 14.5px;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* Hero Plot Panel */
      .heroplot {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        aspect-ratio: 4/3;
        position: relative;
        overflow: hidden;
      }
      .corner-bracket {
        position: absolute;
        width: 14px;
        height: 14px;
        pointer-events: none;
      }
      .corner-bracket.tl {
        top: 10px;
        left: 10px;
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }
      .corner-bracket.tr {
        top: 10px;
        right: 10px;
        border-top: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .corner-bracket.bl {
        bottom: 10px;
        left: 10px;
        border-bottom: 1px solid var(--line);
        border-left: 1px solid var(--line);
      }
      .corner-bracket.br {
        bottom: 10px;
        right: 10px;
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .hero-readout {
        position: absolute;
        top: 16px;
        left: 18px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        background: color-mix(in srgb, var(--panel) 85%, transparent);
        padding: 4px 8px;
        border-radius: 3px;
        border: 1px solid var(--line);
      }

      /* Chapter Grid */
      .chapter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 40px;
        padding: 0 clamp(20px, 4vw, 56px) 60px;
        max-width: 1300px;
      }
      .chap-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 18px 18px 16px;
        box-shadow:
          inset 0 0 0 3px var(--panel),
          inset 0 0 0 4px var(--line);
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          transform 0.25s var(--ease),
          border-color 0.25s var(--ease);
      }
      .chap-card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
      }
      .chap-card.soon {
        opacity: 0.6;
      }
      .chap-card-eyebrow {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        letter-spacing: 0.15em;
      }
      .chap-card-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 21px;
        color: var(--ink);
      }
      .chap-card-blurb {
        font-family: var(--sans);
        font-size: 14px;
        color: var(--muted);
        line-height: 1.45;
        flex: 1;
      }
      .chap-card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .chap-card-foot .lessons-cnt {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      /* Formulas Sheet */
      .formula-header {
        margin-bottom: 24px;
      }
      .formula-header h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 36px;
        color: var(--ink);
      }
      .formula-header p {
        font-family: var(--serif);
        font-size: 17px;
        color: var(--muted);
        margin-top: 6px;
      }
      .filter-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0;
      }
      .f-chip {
        font-family: var(--mono);
        font-size: 11px;
        padding: 5px 12px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        transition: all 0.15s var(--ease);
      }
      .f-chip.active {
        background: var(--ink);
        color: var(--panel);
        border-color: var(--ink);
      }
      .formula-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
        margin-top: 20px;
      }
      .formula-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 16px 18px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow:
          inset 0 0 0 3px var(--panel),
          inset 0 0 0 4px var(--line);
      }
      .formula-eyebrow {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .formula-name {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        margin: 4px 0 12px;
      }
      .formula-math {
        text-align: center;
        margin: 10px 0;
      }
      .formula-foot {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }
      .copy-latex-btn {
        width: 30px;
        height: 30px;
        border-radius: 4px;
        color: var(--muted);
        border: 1px solid var(--line);
        background: var(--bg);
        transition: all 0.15s var(--ease);
      }
      .copy-latex-btn:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      /* Search Palette */
      .palette {
        position: fixed;
        inset: 0;
        background: rgba(var(--shadow), 0.45);
        z-index: 90;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: 14vh;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
      }
      .palette.open {
        display: flex;
      }
      .palette-box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        width: min(620px, 92vw);
        box-shadow: 0 24px 60px rgba(var(--shadow), 0.35);
        overflow: hidden;
        animation: rise 0.2s var(--ease);
      }
      .palette-input-wrap {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .palette-input {
        flex: 1;
        height: 100%;
        background: none;
        border: 0;
        font-family: var(--sans);
        font-size: 16px;
        color: var(--ink);
        outline: none;
      }
      .palette-results {
        max-height: 52vh;
        overflow-y: auto;
        padding: 8px 0;
        scrollbar-width: thin;
      }
      .palette-row {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 18px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .palette-row:hover,
      .palette-row.selected {
        background: var(--chip);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .palette-row-title {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .palette-row-crumbs {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
      }
      .palette-row-snippet {
        font-family: var(--serif);
        font-size: 13px;
        color: var(--muted);
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .palette-row-snippet mark {
        background: var(--accent-tint);
        color: var(--ink);
        padding: 0 2px;
        border-radius: 2px;
      }
      .palette-empty {
        padding: 24px 18px;
        font-family: var(--serif);
        font-size: 15px;
        color: var(--muted);
        text-align: center;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: var(--panel);
        font-family: var(--mono);
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 4px;
        box-shadow: 0 8px 24px rgba(var(--shadow), 0.3);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s var(--ease);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Mobile Drawer Scrim */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(var(--shadow), 0.4);
        z-index: 35;
        display: none;
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }
      .scrim.show {
        display: block;
      }

      /* Animations & Media Queries */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .rise {
        animation: rise 0.5s var(--ease) both;
        animation-delay: calc(var(--i, 0) * 35ms);
      }
      @keyframes pop {
        0% {
          transform: scale(0.6);
        }
        60% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
        }
      }
      .pop {
        animation: pop 0.35s var(--ease);
      }

      @media (max-width: 1180px) {
        .shell {
          grid-template-columns: 292px minmax(0, 1fr);
        }
        aside.toc {
          display: none;
        }
      }
      @media (max-width: 900px) {
        .topbar .menu {
          display: inline-flex;
        }
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        aside.side {
          position: fixed;
          left: 0;
          top: 56px;
          bottom: 0;
          width: min(86vw, 320px);
          background: var(--panel);
          z-index: 40;
          transform: translateX(-102%);
          transition: transform 0.4s var(--ease);
          box-shadow: 4px 0 20px rgba(var(--shadow), 0.15);
        }
        aside.side.drawer-open {
          transform: translateX(0);
        }
      }
      @media (max-width: 700px) {
        .topbar nav.crumbs {
          display: none;
        }
        .topbar .searchbtn {
          min-width: 34px;
          width: 34px;
          padding: 0;
          justify-content: center;
        }
        .topbar .searchbtn .search-text,
        .topbar .searchbtn kbd {
          display: none;
        }
      }
      @media (max-width: 560px) {
        .body-text {
          font-size: 17.5px;
        }
        .hero {
          grid-template-columns: 1fr;
          gap: 24px;
          padding: 32px 20px 20px;
        }
        .widget-controls {
          grid-template-columns: 1fr;
        }
        .pn {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          transition-duration: 0.01s !important;
          animation-delay: 0s !important;
        }
      }

      @media print {
        header.topbar,
        aside.side,
        aside.toc,
        .palette,
        .toast,
        .widget-controls,
        button.complete {
          display: none !important;
        }
        body {
          background: #fff !important;
          color: #000 !important;
          background-image: none !important;
        }
        .shell {
          display: block;
          max-width: 100%;
        }
        main#view {
          padding: 0;
          max-width: 100%;
        }
        details.derivation,
        .practice-sol-drawer {
          grid-template-rows: 1fr !important;
          display: block !important;
        }
        .example-card {
          break-inside: avoid;
        }
      }
    </style>
  </head>

    <header class="topbar">
      <button class="menu" aria-label="Toggle navigation">
        <svg class="ico"><use href="#i-menu" /></svg>
      </button>
      <a class="logo" href="#/">
        <div class="logo-box">∫</div>
        <div class="logo-text">Mathesis</div>
      </a>
      <nav class="crumbs" aria-label="Breadcrumb"></nav>
      <div style="flex: 1"></div>
      <button class="searchbtn" aria-label="Search lessons and formulas">
        <svg class="ico" style="width: 15px; height: 15px">
          <use href="#i-search" />
        </svg>
        <span class="search-text">Search lessons and formulas…</span>
        <kbd id="search-kbd">⌘K</kbd>
      </button>
      <button id="theme" aria-label="Switch to blackboard">
        <svg class="ico" id="theme-ico"><use href="#i-moon" /></svg>
      </button>
      <div class="ring" id="overall"></div>
    </header>

    <div class="scrim" aria-hidden="true"></div>

    <div class="shell">
      <aside class="side" aria-label="Course contents"></aside>
      <main id="view"></main>
      <aside class="toc" aria-label="On this page">
        <div class="toc-sticky">
          <div class="toc-eyebrow">On this page</div>
          <nav class="toc-nav"></nav>
        </div>
      </aside>
    </div>

    <div class="palette" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="palette-box">
        <div class="palette-input-wrap">
          <svg
            class="ico"
            style="width: 18px; height: 18px; color: var(--muted)"
          >
            <use href="#i-search" />
          </svg>
          <input
